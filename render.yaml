services:
  - type: web
    name: brewhaus-cafe-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://cafe.infinigrowsoftech.com
      - key: CUSTOMER_APP_URL
        value: https://cafe.infinigrowsoftech.com
      - key: ADMIN_APP_URL
        value: https://admin-cafe.infinigrowsoftech.com
      - key: ADMIN_CLIENT_URL
        value: https://admin-cafe.infinigrowsoftech.com
      - key: SERVER_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: SENTRY_DSN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
