services:
  - type: web
    name: brewhaus-cafe-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://client-ten-peach-93.vercel.app
      - key: CUSTOMER_APP_URL
        value: https://client-ten-peach-93.vercel.app
      - key: ADMIN_APP_URL
        value: https://admin-app-delta-eight.vercel.app
      - key: ADMIN_CLIENT_URL
        value: https://admin-app-delta-eight.vercel.app
      - key: SERVER_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: DEMO_PAYMENTS_ENABLED
        value: "true"
